notARepository: skip
promptToReturnFromSubprocess: false
gui:
  nerdFontsVersion: 3
  shrinkSidePanelsToContent: true
  showRootItemInFileTree: false
  sidePanels:
  - [files, worktrees, submodules]
  - [branches, remotes, tags]
  - [commits, reflog, stash]
git:
  overrideGpg: true
  pagers:
    - pager: delta --dark --paging=never
customCommands:
  - key: D
    context: commits
    description: Sync author/committer dates from here on
    command: "git rebase --committer-date-is-author-date {{.SelectedLocalCommit.Hash}}~1"

# begin index from 1
set -g base-index 1
setw -g pane-base-index 1

# ble.sh vim-mode delay
set -sg escape-time 1

# vim motions
set -g status-keys vi
setw -g mode-keys vi

# vim visual, visual-block, yank, paste
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection
bind p paste-buffer
bind P choose-buffer

# enable mouse mode
set -g mouse on

# reduce touchpad scroll sensitivity (3-lines -> 1-line)
bind -T copy-mode-vi WheelUpPane send-keys -X scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X scroll-down

# toggle status bar
bind b set status

# send recently copied buffer to system clipboard "+"
bind + run "tmux show-buffer | wl-copy"

# enable terminal truecolors instead of 256-colors
# Ptyxis, Termux, etc. use $COLORTERM=truecolor hint, but tmux doesn't respect it
# ref: https://github.com/tmux/tmux/issues/4300
set -a terminal-features "xterm-256color:RGB"

# allow window focus events and escape sequences
set -g focus-events on
set -g allow-passthrough on

# show active tab in dark green instead of an "*" suffix
set -g window-status-current-format "#[fg=white,bg=#124826,bold] #I:#W "
